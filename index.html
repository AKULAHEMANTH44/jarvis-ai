<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/jarvis-arc.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S. — Autonomous Holographic Interface</title>
    <!-- Google Fonts for Futuristic HUD UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      /* Base scanline overlay and custom scrollbar */
      body {
        margin: 0;
        padding: 0;
        background-color: #02070e;
        color: #00f0ff;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: 'Share Tech Mono', monospace, Consolas, sans-serif;
      }
      
      /* Subtle scanlines effect */
      .scanlines {
        position: relative;
      }
      .scanlines::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 40;
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
        opacity: 0.6;
      }
      
      /* Hex grid background effect */
      .hex-bg {
        background-image: radial-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 0);
        background-size: 28px 28px;
        background-position: -19px -19px;
      }
    </style>
  </head>
  <body class="scanlines bg-black text-cyan-400 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
