<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0077ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#001122" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="12, 6" opacity="0.6"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#0077ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="100" cy="100" r="74" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#neonBlur)"/>
  
  <!-- 10 Reactor Coils -->
  <g transform="translate(100, 100)" stroke="#00f0ff" stroke-width="2.5" fill="none">
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" />
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" transform="rotate(36)" />
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" transform="rotate(72)" />
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" transform="rotate(108)" />
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" transform="rotate(144)" />
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" transform="rotate(180)" />
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" transform="rotate(216)" />
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" transform="rotate(252)" />
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" transform="rotate(288)" />
    <rect x="-6" y="-68" width="12" height="14" rx="2" fill="rgba(0,240,255,0.4)" transform="rotate(324)" />
  </g>

  <!-- Inner Rings & Core -->
  <circle cx="100" cy="100" r="48" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="20, 8"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <!-- Central Glowing Plasma Core -->
  <circle cx="100" cy="100" r="28" fill="url(#arcGlow)"/>
  <!-- Triangle center mark -->
  <polygon points="100,82 116,110 84,110" fill="none" stroke="#ffffff" stroke-width="2" filter="url(#neonBlur)"/>
</svg>
